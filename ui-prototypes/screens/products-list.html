<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنتجات</title>
  <link rel="stylesheet" href="../styles/base.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <div class="breadcrumbs"><a href="../index.html" class="btn" style="padding:6px 10px">العودة</a></div>
        <h1>المنتجات</h1>
      </div>
      <div class="actions">
        <a class="btn" href="product-form.html">منتج جديد</a>
      </div>
    </div>

    <div class="card-surface">
      <div class="form-grid">
        <div class="field col-6">
          <label>بحث</label>
          <input type="search" placeholder="ابحث عن منتج...">
        </div>
        <div class="field col-6">
          <label>التصنيف</label>
          <select>
            <option>الكل</option>
            <option>إلكترونيات</option>
            <option>ملابس</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card-surface" style="margin-top: var(--space-4)">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>الاسم</th>
            <th>السعر</th>
            <th>المخزون</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1001</td>
            <td>هاتف ذكي</td>
            <td>299.00</td>
            <td>42</td>
            <td class="actions">
              <a class="btn" href="product-form.html">تعديل</a>
              <button class="btn" style="background: linear-gradient(180deg, var(--danger), #e63946); color: #fff;">حذف</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
