<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="../styles/base.css">
  <style>
    .center { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: 100%; max-width: 420px; }
  </style>
  <meta name="description" content="شاشة تسجيل الدخول بنمط RTL">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='16' fill='%234895ef'/><text x='50' y='62' text-anchor='middle' font-size='48' fill='white'>د</text></svg>">
  </head>
<body>
  <div class="center">
    <div class="card-surface login-card">
      <div class="actions" style="justify-content: space-between; align-items:center; margin-bottom: 12px;">
        <a href="../index.html" class="btn" style="padding:6px 10px">العودة</a>
        <strong>تسجيل الدخول</strong>
      </div>
      <div class="field">
        <label for="username">اسم المستخدم أو البريد</label>
        <input id="username" type="text" placeholder="example@domain.com">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••••">
      </div>
      <div class="actions" style="justify-content: space-between; align-items:center;">
        <label style="display:flex; align-items:center; gap:8px; color: var(--text-2);">
          <input type="checkbox"> تذكرني
        </label>
        <a href="#" style="color: var(--accent-9); text-decoration: none;">نسيت كلمة المرور؟</a>
      </div>
      <div class="actions" style="margin-top: 12px;">
        <button class="btn" style="width: 100%; justify-content: center;">دخول</button>
      </div>
    </div>
  </div>
</body>
</html>
