<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نموذج المستخدم</title>
  <link rel="stylesheet" href="../styles/base.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <div class="breadcrumbs"><a href="users-list.html" class="btn" style="padding:6px 10px">العودة</a></div>
        <h1>نموذج المستخدم</h1>
      </div>
      <div class="actions">
        <button class="btn">حفظ</button>
      </div>
    </div>

    <div class="card-surface">
      <div class="form-grid">
        <div class="field col-6">
          <label for="fullName">الاسم الكامل</label>
          <input id="fullName" type="text" placeholder="مثال: محمد أحمد">
        </div>
        <div class="field col-6">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" placeholder="name@example.com">
        </div>
        <div class="field col-6">
          <label for="role">الدور</label>
          <select id="role">
            <option>مدير</option>
            <option>محرر</option>
            <option>عارض</option>
          </select>
        </div>
        <div class="field col-6">
          <label for="phone">رقم الهاتف</label>
          <input id="phone" type="tel" placeholder="05xxxxxxxx">
        </div>
        <div class="field col-12">
          <label for="notes">ملاحظات</label>
          <textarea id="notes" rows="3" placeholder="أي تفاصيل إضافية"></textarea>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
