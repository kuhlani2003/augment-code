<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نموذج المنتج</title>
  <link rel="stylesheet" href="../styles/base.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <div class="breadcrumbs"><a href="products-list.html" class="btn" style="padding:6px 10px">العودة</a></div>
        <h1>نموذج المنتج</h1>
      </div>
      <div class="actions">
        <button class="btn">حفظ</button>
      </div>
    </div>

    <div class="card-surface">
      <div class="form-grid">
        <div class="field col-6">
          <label for="name">اسم المنتج</label>
          <input id="name" type="text" placeholder="اسم المنتج">
        </div>
        <div class="field col-3">
          <label for="price">السعر</label>
          <input id="price" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="field col-3">
          <label for="stock">المخزون</label>
          <input id="stock" type="number" min="0" step="1" placeholder="0">
        </div>
        <div class="field col-6">
          <label for="category">التصنيف</label>
          <select id="category">
            <option>إلكترونيات</option>
            <option>ملابس</option>
            <option>أخرى</option>
          </select>
        </div>
        <div class="field col-6">
          <label for="sku">SKU</label>
          <input id="sku" type="text" placeholder="SKU-0001">
        </div>
        <div class="field col-12">
          <label for="desc">الوصف</label>
          <textarea id="desc" rows="3"></textarea>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
