<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغيير كلمة المرور</title>
  <link rel="stylesheet" href="../styles/base.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <div class="breadcrumbs"><a href="profile.html" class="btn" style="padding:6px 10px">العودة</a></div>
        <h1>تغيير كلمة المرور</h1>
      </div>
      <div class="actions">
        <button class="btn">حفظ</button>
      </div>
    </div>

    <div class="card-surface">
      <div class="form-grid">
        <div class="field col-6">
          <label for="currentPass">كلمة المرور الحالية</label>
          <input id="currentPass" type="password" placeholder="••••••••">
        </div>
        <div class="field col-6">
          <label for="newPass">كلمة المرور الجديدة</label>
          <input id="newPass" type="password" placeholder="••••••••">
        </div>
        <div class="field col-6">
          <label for="confirmPass">تأكيد كلمة المرور</label>
          <input id="confirmPass" type="password" placeholder="••••••••">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
