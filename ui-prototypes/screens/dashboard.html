<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة المعلومات</title>
  <link rel="stylesheet" href="../styles/base.css">
  <style>
    .stats { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--space-4); }
    .stat { grid-column: span 3; }
    .stat .value { font-size: 1.8rem; font-weight: 800; }
    @media (max-width: 900px) { .stat { grid-column: span 6; } }
    @media (max-width: 600px) { .stat { grid-column: span 12; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <div class="breadcrumbs"><a href="../index.html" class="btn" style="padding:6px 10px">العودة</a></div>
        <h1>لوحة المعلومات</h1>
      </div>
    </div>

    <section class="stats">
      <div class="card-surface stat">
        <div class="muted">المستخدمون النشطون</div>
        <div class="value">1,284</div>
      </div>
      <div class="card-surface stat">
        <div class="muted">جلسات اليوم</div>
        <div class="value">3,905</div>
      </div>
      <div class="card-surface stat">
        <div class="muted">معدّل التحويل</div>
        <div class="value">4.7%</div>
      </div>
      <div class="card-surface stat">
        <div class="muted">الأخطاء</div>
        <div class="value" style="color: var(--danger)">12</div>
      </div>
    </section>

    <section style="margin-top: var(--space-5)">
      <div class="card-surface">
        <h3 style="margin-top:0">آخر العمليات</h3>
        <table>
          <thead>
            <tr>
              <th>الوقت</th>
              <th>المستخدم</th>
              <th>العملية</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>10:12</td>
              <td>أحمد</td>
              <td>تحديث إعدادات</td>
              <td>ناجحة</td>
            </tr>
            <tr>
              <td>09:45</td>
              <td>ليلى</td>
              <td>إنشاء مستخدم</td>
              <td>ناجحة</td>
            </tr>
            <tr>
              <td>09:02</td>
              <td>سارة</td>
              <td>تسجيل دخول</td>
              <td>فشل</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>
