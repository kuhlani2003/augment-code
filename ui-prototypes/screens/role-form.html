<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نموذج الدور</title>
  <link rel="stylesheet" href="../styles/base.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <div class="breadcrumbs"><a href="roles-list.html" class="btn" style="padding:6px 10px">العودة</a></div>
        <h1>نموذج الدور</h1>
      </div>
      <div class="actions">
        <button class="btn">حفظ</button>
      </div>
    </div>

    <div class="card-surface">
      <div class="form-grid">
        <div class="field col-6">
          <label for="roleName">اسم الدور</label>
          <input id="roleName" type="text" placeholder="مثال: مدير">
        </div>
        <div class="field col-6">
          <label for="roleKey">المعرف الفريد</label>
          <input id="roleKey" type="text" placeholder="admin">
        </div>
        <div class="field col-12">
          <label for="roleDesc">الوصف</label>
          <textarea id="roleDesc" rows="3" placeholder="وصف مختصر للدور"></textarea>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
